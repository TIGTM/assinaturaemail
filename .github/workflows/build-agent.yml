name: Build GTM Signature Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone exe
        working-directory: agent
        run: |
          pyinstaller --onefile --noconsole `
            --name GTMSignatureAgent `
            --distpath ../dist `
            gtm_signature_agent.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Stage exe for installer
        run: Copy-Item dist/GTMSignatureAgent.exe agent/

      - name: Build per-user installer
        working-directory: agent
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Move-Item Output/GTMSignatureAgentSetup.exe ../dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTMSignatureAgent
          path: |
            dist/GTMSignatureAgent.exe
            dist/GTMSignatureAgentSetup.exe
          retention-days: 90

      - name: Publish to "agent-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: GTM Signature Agent (latest)
          body: |
            Build automatico do agente Windows.

            Arquivos:
            - **GTMSignatureAgentSetup.exe** — instalador per-user (recomendado, distribua este pros usuarios)
            - **GTMSignatureAgent.exe** — executavel standalone (so pra teste manual / debug)

            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
          files: |
            dist/GTMSignatureAgent.exe
            dist/GTMSignatureAgentSetup.exe
          prerelease: true
          make_latest: false
