{% extends "base.html" %}
{% block title %}Editar — {{ emp.name }}{% endblock %}

{% block content %}
<h1 class="page-title">✏️ Editar funcionário</h1>

<div class="card" style="max-width:600px;">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" name="name" value="{{ emp.name or '' }}" required>
      </div>
      <div class="form-group">
        <label>Cargo</label>
        <input type="text" name="title" value="{{ emp.title or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>E-mail</label>
        <input type="text" value="{{ emp.email }}" disabled style="opacity:.6;">
      </div>
      <div class="form-group">
        <label>Telefone</label>
        <input type="text" name="phone" value="{{ emp.phone or '' }}" placeholder="(31) 9.9999-9999">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Departamento</label>
        <input type="text" name="department" value="{{ emp.department or '' }}">
      </div>
      <div class="form-group">
        <label>Website</label>
        <input type="text" name="website" value="{{ emp.website or '' }}" placeholder="www.gtmalimentos.com.br">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Instagram</label>
        <input type="text" name="instagram" value="{{ emp.instagram or '' }}" placeholder="@gtmalimentos">
      </div>
      <div class="form-group">
        <label>Campo extra 1</label>
        <input type="text" name="extra1" value="{{ emp.extra1 or '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Campo extra 2</label>
      <input type="text" name="extra2" value="{{ emp.extra2 or '' }}">
    </div>

    <div class="form-actions">
      <a href="/employees" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
    </div>
  </form>
</div>
{% endblock %}
